name: Checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: dist is up to date
        run: node scripts/build.mjs --check
      - name: Token contrast (WCAG 2.2 AA)
        run: node scripts/check-contrast.mjs
